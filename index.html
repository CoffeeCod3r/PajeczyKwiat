<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dla mojej wspaniałej kobiety</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Figtree:wght@400;500&display=swap">
<style>
/* Layout: pełnoekranowa nocna łąka; dedykacja w lewym górnym rogu, kwiaty w środku, przycisk na dole */
:root {
  --night: #050b07;
  --petal: #e3202b;
  --ember: #ff6a52;
  --blush: #ffb3a8;
  --ink: #f6ece8;
  --mist: #aebcb1;
  --display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#glow {
  pointer-events: none;
  filter: blur(16px) saturate(1.3);
  mix-blend-mode: screen;
  opacity: 0.75;
}
.head {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + clamp(20px, 4vw, 44px));
  left: 0;
  padding-left: max(clamp(16px, 4vw, 48px), env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
  display: grid;
  gap: 8px;
  max-width: min(40rem, 100%);
  box-sizing: border-box;
}
.eyebrow {
  font-family: var(--display);
  font-size: 0.8rem;
  letter-spacing: 0.4em;
  color: var(--ember);
}
h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(1.9rem, min(5.4vw, 9vh), 4.2rem);
  line-height: 1.05;
  line-height: 1;
  letter-spacing: 0.01em;
  text-wrap: balance;
  text-shadow: 0 0 30px rgba(255, 60, 50, 0.25);
}
.sub {
  font-family: var(--display);
  font-style: italic;
  font-size: clamp(1rem, 2.2vw, 1.2rem);
  color: var(--blush);
}
.heart { color: var(--ember); font-style: normal; display: inline-block; animation: beat 1.6s ease-in-out infinite; }
@keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.25); } 30% { transform: scale(1); } 45% { transform: scale(1.15); } }
.foot {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(16px, 3vw, 32px));
  padding-left: max(clamp(16px, 4vw, 48px), env(safe-area-inset-left, 0px));
  padding-right: max(clamp(16px, 4vw, 48px), env(safe-area-inset-right, 0px));
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 14px 24px;
  pointer-events: none;
}
.note {
  margin: 0;
  max-width: 36ch;
  min-width: 0;
  font-size: 0.85rem;
  line-height: 1.55;
  color: var(--mist);
}
.note b { color: var(--ink); font-weight: 500; }
button {
  pointer-events: auto;
  font: 500 0.82rem/1 var(--body);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink);
  background: color-mix(in srgb, var(--petal) 18%, transparent);
  border: 1px solid color-mix(in srgb, var(--petal) 60%, transparent);
  border-radius: 999px;
  padding: 13px 20px;
  cursor: pointer;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: background .25s, border-color .25s, transform .2s;
}
button:hover { background: color-mix(in srgb, var(--petal) 35%, transparent); border-color: var(--ember); }
button:active { transform: scale(0.97); }
button:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .heart { animation: none; } }
@media (max-width: 640px) {
  .foot { flex-direction: column; align-items: stretch; }
  .note { font-size: 0.8rem; }
  button { width: 100%; padding: 14px 18px; }
}
@media (max-height: 520px) {
  .note { display: none; }
  .head { gap: 4px; max-width: 46%; }
  .sub { font-size: 0.95rem; }
}
</style>

<canvas id="scene" aria-label="Animacja rozkwitu czerwonych lilii pajęczych dla mojej wspaniałej kobiety"></canvas>
<canvas id="glow" aria-hidden="true"></canvas>

<header class="head">
  <span class="eyebrow">彼岸花 · higanbana</span>
  <h1>Dla mojej wspaniałej kobiety</h1>
  <span class="sub">Bukiet, który nigdy nie zwiędnie <span class="heart">♥</span></span>
</header>

<footer class="foot">
  <p class="note">Rozkwitają od nowa za każdym razem, gdy tu zajrzysz. <b>Dotknij kwiatu</b>, a coś Ci od niego przyleci.</p>
  <button id="replay" type="button">Niech rozkwitną jeszcze raz</button>
</footer>

<script>
(() => {
  const cv = document.getElementById('scene');
  const ctx = cv.getContext('2d');
  const glow = document.getElementById('glow');
  const gctx = glow.getContext('2d');
  const fg = document.createElement('canvas');
  const fx = fg.getContext('2d');
  const bg = document.createElement('canvas');
  const bgx = bg.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 0, H = 0, S = 1, dpr = 1;
  let flowers = [], pollen = [], bokeh = [], falling = [], hearts = [];
  let start = performance.now(), last = start;

  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
  const easeInOut = t => { t = clamp(t, 0, 1); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  const easeBack = t => { t = clamp(t, 0, 1); const c = 1.15, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

  /* ---------- tło ---------- */
  function buildBackground() {
    bg.width = W * dpr; bg.height = H * dpr;
    bgx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const g = bgx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0a170d');
    g.addColorStop(0.5, '#0b1f11');
    g.addColorStop(1, '#030604');
    bgx.fillStyle = g; bgx.fillRect(0, 0, W, H);

    for (let i = 0; i < 30; i++) {
      const x = rnd() * W, y = rnd() * H * 0.75, r = (90 + rnd() * 240) * S;
      const rg = bgx.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, `rgba(${60 + rnd() * 50 | 0},${120 + rnd() * 70 | 0},${45 + rnd() * 30 | 0},${0.05 + rnd() * 0.09})`);
      rg.addColorStop(1, 'rgba(20,50,25,0)');
      bgx.fillStyle = rg; bgx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    // rozmyte lilie w oddali
    bgx.save();
    bgx.filter = `blur(${Math.max(4, 9 * S)}px)`;
    for (let i = 0; i < 14; i++) {
      const x = rnd() * W, y = H * (0.72 + rnd() * 0.3), r = (14 + rnd() * 26) * S;
      bgx.strokeStyle = 'rgba(70,120,60,0.35)'; bgx.lineWidth = 3 * S;
      bgx.beginPath(); bgx.moveTo(x, y); bgx.lineTo(x + (rnd() - 0.5) * 20, H + 10); bgx.stroke();
      bgx.fillStyle = `rgba(${190 + rnd() * 50 | 0},30,35,${0.25 + rnd() * 0.25})`;
      for (let k = 0; k < 9; k++) {
        const a = rnd() * Math.PI * 2;
        bgx.beginPath();
        bgx.ellipse(x + Math.cos(a) * r * 0.6, y + Math.sin(a) * r * 0.4 - r * 0.2, r * 0.5, r * 0.18, a, 0, Math.PI * 2);
        bgx.fill();
      }
    }
    bgx.restore();
    for (let i = 0; i < 20; i++) {
      const x = rnd() * W, y = H * (0.8 + rnd() * 0.25), r = (25 + rnd() * 70) * S;
      const rg = bgx.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, `rgba(200,30,35,${0.1 + rnd() * 0.14})`);
      rg.addColorStop(1, 'rgba(120,10,20,0)');
      bgx.fillStyle = rg; bgx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    const vg = bgx.createRadialGradient(W * 0.5, H * 0.45, Math.min(W, H) * 0.25, W * 0.5, H * 0.5, Math.max(W, H) * 0.8);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.62)');
    bgx.fillStyle = vg; bgx.fillRect(0, 0, W, H);
  }

  /* ---------- model kwiatów ---------- */
  function makeFlower(x, topY, delay, scale) {
    const n = 6 + (rnd() > 0.45 ? 1 : 0);
    const florets = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + (rnd() - 0.5) * 0.45;
      const petals = [];
      for (let k = 0; k < 6; k++) petals.push({ d: k * 0.035 + rnd() * 0.05, len: 0.88 + rnd() * 0.22, wob: rnd() * 6 });
      const stamens = [];
      for (let j = 0; j < 7; j++) stamens.push({ sp: (j - 3) * 0.27 + (rnd() - 0.5) * 0.08, len: j === 3 ? 1.08 : 0.86 + rnd() * 0.2, lift: 0.32 + rnd() * 0.12, curl: (rnd() - 0.5) * 0.3 });
      florets.push({ a, depth: Math.sin(a), fore: 0.5 + 0.5 * Math.abs(Math.cos(a)), delay: rnd() * 1.3, seed: rnd() * 100, tilt: (rnd() - 0.5) * 0.3, petals, stamens });
    }
    florets.sort((p, q) => p.depth - q.depth);
    return { x, topY, delay, scale, bend: (rnd() - 0.5) * 70 * S, sway: rnd() * 10, off: 0, vel: 0, florets, top: [x, topY] };
  }

  function layout() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = fg.width = W * dpr; cv.height = fg.height = H * dpr;
    glow.width = Math.max(1, W / 4 | 0); glow.height = Math.max(1, H / 4 | 0);
    const narrow = W < 640, short = H < 520 && !narrow;
    S = narrow ? Math.min(W / 500, H / 760) : Math.min(W, H * 1.1) / 900;
    seed = 11;
    buildBackground();
    const spots = narrow
      ? [[0.24, 0.56, 0.3, 0.88], [0.58, 0.42, 0.0, 1.05], [0.82, 0.63, 0.6, 0.8]]
      : short
      ? [[0.58, 0.58, 0.3, 0.9], [0.74, 0.42, 0.0, 1.05], [0.9, 0.62, 0.6, 0.82]]
      : [[0.15, 0.68, 1.3, 0.72], [0.86, 0.66, 1.1, 0.75], [0.30, 0.46, 0.35, 0.95], [0.71, 0.52, 0.7, 1.0], [0.52, 0.30, 0.0, 1.12]];
    flowers = spots.map(([a, b, d, s]) => makeFlower(W * a, H * b, d, s));
    bokeh = Array.from({ length: 22 }, () => ({
      x: rnd() * W, y: rnd() * H, r: (6 + rnd() * 28) * S,
      vx: (rnd() - 0.5) * 8, vy: -3 - rnd() * 6, a: 0.04 + rnd() * 0.08, red: rnd() > 0.55, ph: rnd() * 6,
    }));
  }

  /* ---------- łodyga ---------- */
  function stemPoint(f, t, sway) {
    const x0 = f.x - f.bend * 0.4, y0 = H + 20;
    const x2 = f.x + sway, y2 = f.topY;
    const cx = f.x + f.bend + sway * 0.3, cy = (y0 + y2) / 2;
    const u = 1 - t;
    return [u * u * x0 + 2 * u * t * cx + t * t * x2, u * u * y0 + 2 * u * t * cy + t * t * y2];
  }

  function drawStem(c, f, grow, sway, bud) {
    const sc = S * f.scale, steps = 60;
    const pts = [];
    for (let i = 0; i <= steps; i++) pts.push(stemPoint(f, (i / steps) * grow, sway));
    const L = [], R = [];
    for (let i = 0; i <= steps; i++) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(steps, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1]; const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
      const t = (i / steps) * grow;
      const w = (3.6 - 1.7 * t) * sc;
      L.push([pts[i][0] - ty * w, pts[i][1] + tx * w]);
      R.push([pts[i][0] + ty * w, pts[i][1] - tx * w]);
    }
    const g = c.createLinearGradient(f.x - 8 * sc, 0, f.x + 8 * sc, 0);
    g.addColorStop(0, '#2c5e2a'); g.addColorStop(0.45, '#4f9446'); g.addColorStop(1, '#244d24');
    c.fillStyle = g;
    c.beginPath(); c.moveTo(L[0][0], L[0][1]);
    for (const p of L) c.lineTo(p[0], p[1]);
    for (let i = R.length - 1; i >= 0; i--) c.lineTo(R[i][0], R[i][1]);
    c.closePath(); c.fill();
    // połysk
    c.strokeStyle = 'rgba(190,235,150,0.28)'; c.lineWidth = 0.9 * sc;
    c.beginPath();
    for (let i = 0; i <= steps; i++) {
      const p = [(L[i][0] * 0.7 + pts[i][0] * 0.3), (L[i][1] * 0.7 + pts[i][1] * 0.3)];
      i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]);
    }
    c.stroke();

    const tip = pts[steps], pre = pts[steps - 2];
    const ang = Math.atan2(tip[1] - pre[1], tip[0] - pre[0]);
    // pąk na czubku
    if (bud > 0.01) {
      c.save(); c.globalAlpha = bud; c.translate(tip[0], tip[1]); c.rotate(ang);
      const bg2 = c.createLinearGradient(0, 0, 24 * sc, 0);
      bg2.addColorStop(0, '#3b6b2f'); bg2.addColorStop(0.4, '#8c1a1f'); bg2.addColorStop(1, '#d9343a');
      c.fillStyle = bg2;
      c.beginPath(); c.moveTo(-2 * sc, 0);
      c.bezierCurveTo(4 * sc, -9 * sc, 18 * sc, -7 * sc, 26 * sc, 0);
      c.bezierCurveTo(18 * sc, 7 * sc, 4 * sc, 9 * sc, -2 * sc, 0);
      c.fill(); c.restore();
    }
    return { tip, ang };
  }

  function drawBracts(c, f, tip, open) {
    const sc = S * f.scale;
    c.fillStyle = 'rgba(150,140,85,0.85)';
    for (const s of [-1, 1]) {
      const spread = 0.5 + open * 0.9;
      c.save(); c.translate(tip[0], tip[1] + 3 * sc); c.rotate(Math.PI / 2 + s * spread);
      c.beginPath(); c.moveTo(0, -2.5 * sc);
      c.quadraticCurveTo(10 * sc, -2 * sc, 22 * sc, s * 2 * sc);
      c.quadraticCurveTo(10 * sc, 2.5 * sc, 0, 2.5 * sc);
      c.fill(); c.restore();
    }
  }

  /* ---------- płatek ---------- */
  function smoothPath(c, pts) {
    c.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
      c.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
    }
    const e = pts[pts.length - 1]; c.lineTo(e[0], e[1]);
  }

  function petal(c, B, A, dir, L, Wd, curl, sd, shade) {
    const steps = 30, seg = L / steps;
    const ang0 = Math.atan2(dir[1], dir[0]);
    const cross = A[0] * dir[1] - A[1] * dir[0];
    const sgn = cross >= 0 ? 1 : -1;
    const mag = Math.min(1, Math.abs(cross) * 2.2 + 0.35);
    let x = B[0], y = B[1];
    const pts = [[x, y]], tan = [ang0];
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      const a = ang0 + sgn * mag * curl * 2.1 * Math.pow(t, 2.6) + Math.sin(t * 4 + sd) * 0.06 * curl;
      x += Math.cos(a) * seg; y += Math.sin(a) * seg + seg * 0.08 * curl * t;
      pts.push([x, y]); tan.push(a);
    }
    const left = [], right = [];
    for (let i = 0; i <= steps; i++) {
      const t = i / steps, a = tan[i];
      const env = Wd * Math.pow(Math.sin(Math.PI * Math.min(1, t * 1.03)), 0.62) * (1 - 0.32 * t);
      const rl = 1 + 0.24 * Math.sin(t * 31 + sd) + 0.1 * Math.sin(t * 67 + sd * 2);
      const rr = 1 + 0.24 * Math.sin(t * 29 + sd * 1.7 + 2) + 0.1 * Math.sin(t * 59 + sd);
      const nx = -Math.sin(a), ny = Math.cos(a);
      left.push([pts[i][0] + nx * env * rl, pts[i][1] + ny * env * rl]);
      right.push([pts[i][0] - nx * env * rr, pts[i][1] - ny * env * rr]);
    }
    const tip = pts[steps], d = shade;
    const g = c.createLinearGradient(B[0], B[1], tip[0], tip[1]);
    g.addColorStop(0, `rgb(${110 * d | 0},${22 * d | 0},${22 * d | 0})`);
    g.addColorStop(0.18, `rgb(${170 * d | 0},${12 * d | 0},${24 * d | 0})`);
    g.addColorStop(0.55, `rgb(${232 * d | 0},${30 * d | 0},${40 * d | 0})`);
    g.addColorStop(1, `rgb(${255 * d | 0},${84 * d | 0},${62 * d | 0})`);
    c.fillStyle = g;
    c.beginPath();
    smoothPath(c, left);
    const rr = right.slice().reverse();
    for (let i = 0; i < rr.length - 1; i++) {
      const mx = (rr[i][0] + rr[i + 1][0]) / 2, my = (rr[i][1] + rr[i + 1][1]) / 2;
      c.quadraticCurveTo(rr[i][0], rr[i][1], mx, my);
    }
    c.closePath(); c.fill();
    c.strokeStyle = `rgba(90,0,12,${0.35 * d})`; c.lineWidth = 0.6 * S; c.stroke();
    // nerw środkowy i połysk
    c.strokeStyle = `rgba(255,160,140,${0.42 * d})`; c.lineWidth = 0.8 * S;
    c.beginPath(); smoothPath(c, pts.slice(2, steps - 1)); c.stroke();
    c.strokeStyle = `rgba(255,210,190,${0.16 * d})`; c.lineWidth = 1.6 * S;
    c.beginPath(); smoothPath(c, left.slice(4, steps - 6).map((p, i) => [(p[0] + pts[i + 4][0]) / 2, (p[1] + pts[i + 4][1]) / 2])); c.stroke();
  }

  /* ---------- kwiatek ---------- */
  function drawFloret(c, f, fl, cx, cy, p, now, depthShade) {
    const sc = S * f.scale;
    const e = easeOut(p);
    const r = (6 + 16 * e) * sc;
    const base = [cx + Math.cos(fl.a) * r, cy + Math.sin(fl.a) * r * 0.35 - 4 * sc];
    let ax = Math.cos(fl.a) * 0.95 + fl.tilt, ay = -0.28 + Math.sin(fl.a) * 0.2;
    ax = ax * e; ay = ay * e - (1 - e);
    const am = Math.hypot(ax, ay) || 1; ax /= am; ay /= am;
    const A = [ax, ay], N = [-ay, ax];
    const shade = depthShade * (0.7 + 0.3 * (fl.depth * 0.5 + 0.5));

    c.strokeStyle = '#3f7d39'; c.lineWidth = 1.8 * sc; c.lineCap = 'round';
    c.beginPath(); c.moveTo(cx, cy);
    c.quadraticCurveTo((cx + base[0]) / 2, cy - 3 * sc, base[0], base[1]); c.stroke();

    const g = smooth(0.32, 1, p);
    const stamens = back => {
      if (g <= 0) return;
      fl.stamens.forEach((st, j) => {
        if ((j % 2 === 0) !== back) return;
        const sway = Math.sin(now * 0.0011 + fl.seed + j) * 0.04;
        let dx = A[0] + N[0] * (st.sp + sway), dy = A[1] + N[1] * (st.sp + sway);
        const m = Math.hypot(dx, dy); dx /= m; dy /= m;
        const len = 112 * sc * st.len;
        const P0 = base;
        const P1 = [base[0] + dx * len * 0.38, base[1] + dy * len * 0.38 + 4 * sc];
        const P2 = [base[0] + dx * len * 0.78, base[1] + dy * len * 0.78 - len * st.lift * 0.35];
        const P3 = [base[0] + dx * len * (0.86 + st.curl * 0.2) - N[0] * st.curl * 10 * sc, base[1] + dy * len * 0.86 - len * st.lift];
        const steps = 26, k = Math.ceil(steps * g);
        const pts = [];
        for (let i = 0; i <= k; i++) {
          const t = Math.min(g, i / steps), u = 1 - t;
          pts.push([
            u * u * u * P0[0] + 3 * u * u * t * P1[0] + 3 * u * t * t * P2[0] + t * t * t * P3[0],
            u * u * u * P0[1] + 3 * u * u * t * P1[1] + 3 * u * t * t * P2[1] + t * t * t * P3[1],
          ]);
        }
        const end = pts[pts.length - 1], pe = pts[Math.max(0, pts.length - 2)];
        const gr = c.createLinearGradient(P0[0], P0[1], end[0], end[1]);
        gr.addColorStop(0, `rgba(${200 * shade | 0},${20 * shade | 0},${30 * shade | 0},1)`);
        gr.addColorStop(1, `rgba(${255 * shade | 0},${90 * shade | 0},${75 * shade | 0},1)`);
        c.strokeStyle = gr;
        c.lineWidth = (j === 3 ? 1.4 : 1.15) * sc;
        c.beginPath(); smoothPath(c, pts); c.stroke();
        if (g > 0.88) {
          const a = smooth(0.88, 1, g);
          const ta = Math.atan2(end[1] - pe[1], end[0] - pe[0]);
          if (j === 3) {
            c.fillStyle = `rgba(255,170,150,${a})`;
            c.beginPath(); c.arc(end[0], end[1], 1.4 * sc, 0, Math.PI * 2); c.fill();
          } else {
            c.save(); c.translate(end[0], end[1]); c.rotate(ta + Math.PI / 2 + Math.sin(now * 0.002 + j) * 0.25);
            c.fillStyle = `rgba(150,60,40,${a})`;
            c.beginPath(); c.ellipse(0, 0, 3.4 * sc, 1.25 * sc, 0, 0, Math.PI * 2); c.fill();
            c.fillStyle = `rgba(255,205,110,${a})`;
            c.beginPath(); c.ellipse(0, -0.3 * sc, 2.7 * sc, 0.8 * sc, 0, 0, Math.PI * 2); c.fill();
            c.restore();
          }
        }
      });
    };

    stamens(true);
    const breathe = Math.sin(now * 0.0012 + fl.seed) * 0.035;
    fl.petals.forEach((pt, i) => {
      const pp = clamp((p - pt.d) / (1 - 0.25), 0, 1);
      const eo = easeBack(pp);
      const open = eo * 1.85 + breathe;
      const curl = easeInOut(smooth(0.35, 1, pp)) * (1 + Math.sin(now * 0.0009 + pt.wob) * 0.04);
      const phi = (i / 6) * Math.PI * 2 + fl.seed;
      const k = 0.4 * (1 - fl.fore) + 0.15;
      const fw = Math.cos(open), sd = Math.sin(open);
      let dx = A[0] * fw + (N[0] * Math.sin(phi) + A[0] * Math.cos(phi) * k) * sd;
      let dy = A[1] * fw + (N[1] * Math.sin(phi) + A[1] * Math.cos(phi) * k) * sd + 0.1 * sd;
      const m = Math.hypot(dx, dy) || 1;
      const L = 100 * sc * (0.3 + 0.7 * easeOut(pp)) * pt.len;
      const Wd = 6.2 * sc * (1.3 - 0.4 * easeOut(pp));
      const dep = Math.cos(phi) * fl.fore;
      petal(c, base, A, [dx / m, dy / m], L, Wd, curl, fl.seed + i * 1.7, shade * (0.84 + 0.16 * (dep * 0.5 + 0.5)));
    });
    stamens(false);
  }

  /* ---------- drobiazgi ---------- */
  function heartPath(c, x, y, s) {
    c.beginPath();
    c.moveTo(x, y + s * 0.35);
    c.bezierCurveTo(x - s * 1.1, y - s * 0.4, x - s * 0.45, y - s * 1.1, x, y - s * 0.45);
    c.bezierCurveTo(x + s * 0.45, y - s * 1.1, x + s * 1.1, y - s * 0.4, x, y + s * 0.35);
    c.closePath();
  }

  function drawFallingPetal(c, q) {
    c.save(); c.translate(q.x, q.y); c.rotate(q.rot);
    c.scale(1, Math.max(0.15, Math.abs(Math.cos(q.flip))));
    c.globalAlpha = Math.min(1, q.life * 2);
    const s = q.size;
    const g = c.createLinearGradient(-s, 0, s, 0);
    g.addColorStop(0, '#8e1018'); g.addColorStop(0.6, '#e2262f'); g.addColorStop(1, '#ff6a50');
    c.fillStyle = g;
    c.beginPath(); c.moveTo(-s, 0);
    c.bezierCurveTo(-s * 0.3, -s * 0.28, s * 0.5, -s * 0.22, s, -s * 0.05);
    c.bezierCurveTo(s * 0.5, s * 0.14, -s * 0.3, s * 0.2, -s, 0);
    c.fill(); c.restore();
  }

  function burst(x, y) {
    for (let i = 0; i < 16; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4, v = 40 + Math.random() * 90;
      hearts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, s: (4 + Math.random() * 5) * Math.max(0.8, S), rot: (Math.random() - 0.5) * 0.6 });
    }
    for (let i = 0; i < 18; i++) pollen.push({ x, y, vx: (Math.random() - 0.5) * 60, vy: -20 - Math.random() * 50, life: 1 });
  }

  /* ---------- pętla ---------- */
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const t = reduce ? 99 : (now - start) / 1000;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(bg, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (const b of bokeh) {
      if (!reduce) { b.x += b.vx * dt; b.y += b.vy * dt; }
      if (b.y < -40) { b.y = H + 40; b.x = Math.random() * W; }
      const tw = 0.75 + 0.25 * Math.sin(now * 0.001 + b.ph);
      const rg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      rg.addColorStop(0, b.red ? `rgba(255,80,60,${b.a * tw})` : `rgba(190,230,160,${b.a * tw})`);
      rg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    }

    fx.setTransform(1, 0, 0, 1, 0, 0);
    fx.clearRect(0, 0, fg.width, fg.height);
    fx.setTransform(dpr, 0, 0, dpr, 0, 0);

    let bloomed = 0;
    for (const f of flowers) {
      const local = t - f.delay;
      const grow = easeInOut(local / 2.8);
      if (grow <= 0) continue;
      // sprężyna po dotknięciu
      f.vel += (-22 * f.off - 3.4 * f.vel) * dt; f.off += f.vel * dt;
      const wind = reduce ? 0 : (Math.sin(now * 0.00055 + f.sway) * 7 + Math.sin(now * 0.0016 + f.sway * 2) * 2.2) * S;
      const sway = (wind + f.off) * grow;
      const firstOpen = Math.min(...f.florets.map(fl => clamp((local - 2.6 - fl.delay) / 3.8, 0, 1)));
      const bud = grow < 1 ? 1 : 1 - smooth(0, 0.2, Math.max(...f.florets.map(fl => clamp((local - 2.6 - fl.delay) / 3.8, 0, 1)))) ;
      const { tip } = drawStem(fx, f, grow, sway, bud);
      f.top = tip;
      if (grow < 0.995) continue;
      const depthShade = 0.78 + 0.22 * clamp((f.scale - 0.7) / 0.45, 0, 1);
      drawBracts(fx, f, tip, easeOut(firstOpen * 3));
      for (const fl of f.florets) {
        const p = clamp((local - 2.6 - fl.delay) / 3.8, 0, 1);
        drawFloret(fx, f, fl, tip[0], tip[1], p, now, depthShade);
        if (p > 0.9) bloomed++;
        if (!reduce && p > 0.9 && Math.random() < 0.5 * dt) {
          pollen.push({ x: tip[0] + (Math.random() - 0.5) * 140 * S, y: tip[1] - Math.random() * 90 * S, vx: (Math.random() - 0.5) * 12, vy: -6 - Math.random() * 10, life: 1 });
        }
      }
      if (!reduce && firstOpen > 0.95 && Math.random() < 0.05 * dt && falling.length < 14) {
        falling.push({ x: tip[0] + (Math.random() - 0.5) * 80 * S, y: tip[1], vx: (Math.random() - 0.5) * 10, vy: 14 + Math.random() * 10, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 1.5, flip: Math.random() * 6, life: 1, size: (14 + Math.random() * 8) * S });
      }
    }

    for (let i = falling.length - 1; i >= 0; i--) {
      const q = falling[i];
      q.x += (q.vx + Math.sin(now * 0.0012 + i) * 14) * dt; q.y += q.vy * dt;
      q.rot += q.vr * dt; q.flip += 1.6 * dt;
      if (q.y > H * 0.92) q.life -= 0.6 * dt;
      if (q.life <= 0 || q.y > H + 30) { falling.splice(i, 1); continue; }
      drawFallingPetal(fx, q);
    }
    for (let i = pollen.length - 1; i >= 0; i--) {
      const q = pollen[i];
      q.x += q.vx * dt + Math.sin(now * 0.002 + i) * 0.15; q.y += q.vy * dt; q.vx *= 0.99; q.life -= 0.22 * dt;
      if (q.life <= 0) { pollen.splice(i, 1); continue; }
      fx.fillStyle = `rgba(255,205,125,${q.life * 0.85})`;
      fx.beginPath(); fx.arc(q.x, q.y, 1.3 * S + 0.6, 0, Math.PI * 2); fx.fill();
    }
    for (let i = hearts.length - 1; i >= 0; i--) {
      const h = hearts[i];
      h.vy += 10 * dt; h.vx *= 0.985; h.vy *= 0.985;
      h.x += h.vx * dt + Math.sin(now * 0.003 + i) * 0.3; h.y += h.vy * dt; h.life -= 0.42 * dt;
      if (h.life <= 0) { hearts.splice(i, 1); continue; }
      fx.save(); fx.translate(h.x, h.y); fx.rotate(h.rot);
      fx.fillStyle = `rgba(255,${90 + 60 * h.life | 0},${100 + 40 * h.life | 0},${Math.min(1, h.life * 1.5)})`;
      heartPath(fx, 0, 0, h.s * (0.7 + 0.3 * h.life)); fx.fill(); fx.restore();
    }

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(fg, 0, 0);
    gctx.clearRect(0, 0, glow.width, glow.height);
    gctx.drawImage(fg, 0, 0, glow.width, glow.height);

    requestAnimationFrame(frame);
  }

  function replay() { start = performance.now(); pollen = []; falling = []; hearts = []; flowers.forEach(f => { f.off = 0; f.vel = 0; }); }

  cv.addEventListener('pointerdown', e => {
    const x = e.clientX, y = e.clientY;
    let best = null, bd = 1e9;
    for (const f of flowers) { const d = Math.hypot(f.top[0] - x, f.top[1] - y); if (d < bd) { bd = d; best = f; } }
    if (best && bd < 220 * S && !reduce) best.vel += (x < best.top[0] ? 1 : -1) * 90 * S;
    burst(x, y);
  });
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 120); });
  document.getElementById('replay').addEventListener('click', replay);
  layout();
  requestAnimationFrame(frame);
})();
</script>

</body></html>
